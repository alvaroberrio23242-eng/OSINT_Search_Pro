<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - OSINT Search Pro</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#1e1e1e;
            color:white;
            margin:0;
            padding:40px;
        }

        .contenedor{
            max-width:900px;
            margin:auto;
        }

        h1{
            color:#00d4ff;
        }

        .resultado{
            background:#2d2d2d;
            margin:20px 0;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.4);
        }

        .resultado h2{
            margin-top:0;
        }

        .resultado a{
            color:#00d4ff;
            text-decoration:none;
            word-break:break-all;
        }

        .resultado a:hover{
            text-decoration:underline;
        }

        .volver{
            display:inline-block;
            margin-bottom:25px;
            padding:10px 20px;
            background:#00d4ff;
            color:white;
            text-decoration:none;
            border-radius:6px;
        }

        .volver:hover{
            background:#0099cc;
        }
    </style>

</head>
<body>

<div class="contenedor">

    <a class="volver" href="/">⬅ Nueva búsqueda</a>

    <h1>Resultados para: "{{ consulta }}"</h1>

    {% if resultados %}

        {% for r in resultados %}

        <div class="resultado">

            <h2>{{ r.titulo }}</h2>

            <p>{{ r.descripcion }}</p>

            <a href="{{ r.url }}" target="_blank">
                {{ r.url }}
            </a>

        </div>

        {% endfor %}

    {% else %}

        <p>No se encontraron resultados.</p>

    {% endif %}

</div>

</body>
</html>
